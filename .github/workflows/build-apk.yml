name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abo-smra-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to builds branch
        run: |
          mkdir -p /tmp/pub
          cp app/build/outputs/apk/release/app-release.apk /tmp/pub/AboSmra.apk
          cd /tmp/pub
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add AboSmra.apk
          git commit -qm "APK build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
